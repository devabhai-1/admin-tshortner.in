<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Blue Rounded Box (Squircle) -->
  <rect x="30" y="181" width="150" height="150" rx="34" fill="#0084FF"/>

  <!-- White Chain Link Icon -->
  <g transform="translate(105, 256) rotate(-45)">
    <!-- Top Right Loop -->
    <path d="M -10,-26 H 34 A 26,26 0 0,1 34,26 H -10" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom Left Loop -->
    <path d="M 10,26 H -34 A 26,26 0 0,1 -34,-26 H 10" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Line -->
    <line x1="-22" y1="0" x2="22" y2="0" 
          stroke="#FFFFFF" 
          stroke-width="20" 
          stroke-linecap="round"/>
  </g>

  <!-- Text: TeraBox -->
  <text x="200" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#000000" text-rendering="geometricPrecision">TeraBox</text>

  <!-- Text: Shortener -->
  <text x="200" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#000000" text-rendering="geometricPrecision">Shortener</text>
</svg>